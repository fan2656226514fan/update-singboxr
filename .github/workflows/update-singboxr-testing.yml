name: Update sing-box reF1nd beta arm64


on:

  workflow_dispatch:

  schedule:

    - cron: "30 2 * * *"



permissions:

  contents: write



jobs:


  testing:


    runs-on: ubuntu-latest



    steps:



    - name: Checkout

      uses: actions/checkout@v4





    - name: Get latest beta version

      id: version

      shell: bash

      run: |


        TAG=$(curl -fsSL \
        https://api.github.com/repos/reF1nd/sing-box-releases/releases \
        | grep '"tag_name"' \
        | grep reF1nd \
        | grep beta \
        | head -1 \
        | awk -F '"' '{print $4}')



        echo "beta version: $TAG"



        if [ -z "$TAG" ]; then

          echo "获取 beta 版本失败"

          exit 1

        fi



        echo "tag=$TAG" >> $GITHUB_OUTPUT







    - name: Download linux-arm64 beta

      shell: bash

      run: |


        URL=$(curl -fsSL \
        https://api.github.com/repos/reF1nd/sing-box-releases/releases \
        | grep browser_download_url \
        | grep linux-arm64 \
        | grep reF1nd \
        | grep beta \
        | head -1 \
        | awk -F '"' '{print $4}')



        echo "download url:"

        echo "$URL"



        if [ -z "$URL" ]; then

          echo "没有找到 linux-arm64 beta"

          exit 1

        fi



        wget -O source.tar.gz "$URL"








    - name: Extract and repack

      shell: bash

      run: |


        rm -rf work output


        mkdir work output



        tar -xzf source.tar.gz -C work



        BIN=$(find work -name sing-box -type f | head -1)



        if [ ! -f "$BIN" ]; then

          echo "没有找到 sing-box"

          exit 1

        fi



        chmod +x "$BIN"



        cp "$BIN" output/sing-box



        tar -czf \
        sing-box-ref1nd-testing-linux-arm64.tar.gz \
        -C output sing-box



        ls -lh sing-box-ref1nd-testing-linux-arm64.tar.gz







    - name: Delete old testing Release

      uses: actions/github-script@v7


      with:


        script: |


          const releases = await github.rest.repos.listReleases({

            owner: context.repo.owner,

            repo: context.repo.repo

          });



          for (const release of releases.data) {


            if (release.tag_name === "testing") {


              await github.rest.repos.deleteRelease({

                owner: context.repo.owner,

                repo: context.repo.repo,

                release_id: release.id

              });


              console.log("deleted old testing release");

            }

          }







    - name: Create testing Release

      uses: softprops/action-gh-release@v2


      with:


        tag_name: testing



        name: sing-box reF1nd beta testing



        body: |


          自动同步 reF1nd beta 内核


          当前版本:


          ${{ steps.version.outputs.tag }}






        files: |


          sing-box-ref1nd-testing-linux-arm64.tar.gz
