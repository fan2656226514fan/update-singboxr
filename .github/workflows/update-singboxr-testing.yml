name: Update sing-box reF1nd testing arm64


on:

  workflow_dispatch:

  schedule:

    - cron: "0 2 * * *"



permissions:

  contents: write



jobs:


  testing:


    runs-on: ubuntu-latest


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Get latest beta version

      id: version

      shell: bash

      run: |


        curl -fsSL \
        https://api.github.com/repos/reF1nd/sing-box-releases/releases \
        -o releases.json



        TAG=$(python3 - <<'PY'
import json

with open("releases.json") as f:
    releases=json.load(f)

for r in releases:
    tag=r["tag_name"]

    if "reF1nd" in tag and "beta" in tag:
        print(tag)
        break
PY
)



        echo "Latest beta: $TAG"



        if [ -z "$TAG" ]; then

          echo "没有找到 beta 版本"

          exit 1

        fi



        echo "tag=$TAG" >> $GITHUB_OUTPUT





    - name: Download linux-arm64 beta

      shell: bash

      run: |


        URL=$(python3 - <<'PY'
import json

with open("releases.json") as f:
    releases=json.load(f)


for r in releases:

    if "reF1nd" in r["tag_name"] and "beta" in r["tag_name"]:

        for a in r["assets"]:

            name=a["name"]

            if "linux-arm64" in name:

                print(a["browser_download_url"])

                exit()
PY
)



        echo "Download:"

        echo "$URL"



        if [ -z "$URL" ]; then

            echo "找不到 linux-arm64 beta"

            exit 1

        fi



        wget -O source.tar.gz "$URL"







    - name: Extract and repack

      shell: bash

      run: |


        rm -rf work output



        mkdir work output



        tar -xzf source.tar.gz -C work



        BIN=$(find work -type f -name sing-box | head -1)



        if [ ! -f "$BIN" ]; then

            echo "没有找到 sing-box"

            exit 1

        fi



        chmod +x "$BIN"



        cp "$BIN" output/sing-box



        tar -czf \
        sing-box-ref1nd-testing-linux-arm64.tar.gz \
        -C output sing-box



        ls -lh sing-box-ref1nd-testing-linux-arm64.tar.gz








    - name: Delete old testing Release

      uses: actions/github-script@v7

      with:

        script: |


          const releases =
          await github.rest.repos.listReleases({

            owner: context.repo.owner,

            repo: context.repo.repo

          });



          for (const r of releases.data) {


            if (r.tag_name === "testing") {


              await github.rest.repos.deleteRelease({

                owner: context.repo.owner,

                repo: context.repo.repo,

                release_id: r.id

              });


              console.log("deleted old testing release");

            }

          }









    - name: Create testing Release

      uses: softprops/action-gh-release@v2


      with:


        tag_name: testing


        name: sing-box reF1nd testing


        body: |

          自动同步 reF1nd beta 内核


          当前版本:

          ${{ steps.version.outputs.tag }}



        files: |

          sing-box-ref1nd-testing-linux-arm64.tar.gz
