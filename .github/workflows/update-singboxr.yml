name: Update sing-box reF1nd arm64


on:
  workflow_dispatch:

  schedule:
    - cron: "0 2 * * *"


permissions:
  contents: write



jobs:

  update:

    runs-on: ubuntu-latest


    steps:


    - name: Checkout
      uses: actions/checkout@v4



    - name: Get latest version
      id: version
      shell: bash
      run: |

        TAG=$(curl -fsSL \
        https://api.github.com/repos/reF1nd/sing-box-releases/releases/latest \
        | grep '"tag_name"' \
        | cut -d '"' -f4)


        if [ -z "$TAG" ]; then
          echo "获取版本失败"
          exit 1
        fi


        echo "最新版本: $TAG"

        echo "tag=$TAG" >> $GITHUB_OUTPUT




    - name: Download linux-arm64
      shell: bash
      run: |


        URL=$(curl -fsSL \
        https://api.github.com/repos/reF1nd/sing-box-releases/releases/latest \
        | grep browser_download_url \
        | grep linux-arm64 \
        | head -1 \
        | cut -d '"' -f4)



        if [ -z "$URL" ]; then
          echo "没有找到 linux-arm64 文件"
          exit 1
        fi


        echo "下载地址:"
        echo "$URL"


        wget -O source.tar.gz "$URL"




    - name: Extract and repack
      shell: bash
      run: |


        rm -rf work output


        mkdir work output


        tar -xzf source.tar.gz -C work



        BIN=$(find work -name sing-box -type f | head -1)



        if [ ! -f "$BIN" ]; then
          echo "未找到 sing-box"
          exit 1
        fi



        chmod +x "$BIN"



        echo "新内核:"
        file "$BIN"



        # 删除旧版本

        rm -f \
        sing-box-ref1nd-testing-linux-arm64.tar.gz



        cp "$BIN" output/sing-box



        cd output



        tar -czf \
        ../sing-box-ref1nd-testing-linux-arm64.tar.gz \
        sing-box



        cd ..



        ls -lh \
        sing-box-ref1nd-testing-linux-arm64.tar.gz





    - name: Save version
      shell: bash
      run: |


        echo "${{ steps.version.outputs.tag }}" \
        > sing-box-version.txt





    - name: Commit update
      shell: bash
      run: |


        git config user.name github-actions

        git config user.email github-actions@github.com



        git add .



        git commit \
        -m "Update sing-box ${{ steps.version.outputs.tag }}" \
        || exit 0



        git push





    - name: Delete old latest Release
      uses: actions/github-script@v7

      with:

        script: |


          const releases =
          await github.rest.repos.listReleases({

            owner: context.repo.owner,

            repo: context.repo.repo

          });



          for (const release of releases.data) {


            if (release.tag_name === "latest") {


              await github.rest.repos.deleteRelease({

                owner: context.repo.owner,

                repo: context.repo.repo,

                release_id: release.id

              });



              console.log("删除旧 Release");


            }

          }





    - name: Create latest Release
      uses: softprops/action-gh-release@v2

      with:


        tag_name: latest


        name: sing-box reF1nd testing latest



        body: |

          自动同步 reF1nd sing-box

          当前版本:
          ${{ steps.version.outputs.tag }}



        files: |

          sing-box-ref1nd-testing-linux-arm64.tar.gz

          sing-box-version.txt
